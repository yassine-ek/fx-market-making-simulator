name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Sans HISTDATA_DIR, les tests qui lisent les données de marché sont sautés (skipped), pas en échec.
      - run: pytest -q
